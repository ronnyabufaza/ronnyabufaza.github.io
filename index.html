<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronny Abu Faza - Pelajar Sepanjang Hayat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Cinzel', 'Times New Roman', serif;
            background-color: #0f1115;
            color: #ffffff;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        /* Bagian Kiri dengan Background Baru dari GitHub */
        .left-section {
            flex: 1.2;
            background: linear-gradient(rgba(15, 17, 21, 0.7), rgba(15, 17, 21, 0.85)), url('https://github.com/ronnyabufaza/ronnyabufaza.github.io/blob/main/free-photo-of-arabic-language-books-on-a-library-shelf.webp?raw=true') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            position: relative;
        }
        .top-brand {
            font-size: 14px;
            letter-spacing: 4px;
            color: #cccccc;
            text-transform: uppercase;
        }
        .main-title-box {
            margin: auto 0;
        }
        .main-title {
            font-size: clamp(3rem, 5vw, 5.5rem);
            font-weight: 300;
            line-height: 1.1;
            letter-spacing: 2px;
            color: #f0f0f0;
            margin-bottom: 25px;
        }
        .arabic-quote {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 10px;
            font-family: 'Traditional Arabic', serif;
        }
        .translation-quote {
            font-size: 0.9rem;
            color: #aaaaaa;
            font-style: italic;
            max-width: 450px;
            line-height: 1.5;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 28px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            background: #ffffff;
            color: #0f1115;
            border-color: #ffffff;
        }
        /* Bagian Kanan */
        .right-section {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1457369804613-52c61a468e7d?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .right-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 21, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-badge {
            width: 280px;
            height: 280px;
            background: #b08d79;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 4px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
        }
        .profile-arabic-name {
            font-size: 2.2rem;
            color: #ffffff;
            font-weight: bold;
            line-height: 1.3;
        }
        /* Responsif untuk HP */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            .left-section, .right-section {
                min-height: 100vh;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kolom Kiri -->
        <div class="left-section">
            <div class="top-brand">Ronny Abu Faza</div>
            
            <div class="main-title-box">
                <h1 class="main-title">PELAJAR<br>SEPANJANG<br>HAYAT</h1>
                <div class="arabic-quote">وَقُلْ رَبِّ زِدْنِي عِلْمًا</div>
                <div class="translation-quote">"Dan katakanlah: Ya Rabb, tambahkanlah aku ilmu lain di samping ilmu yang telah Engkau ajarkan padaku!'"</div>
                
                <div class="button-group">
                    <a href="#belajar" class="btn">Belajar Bersama</a>
                    <a href="#bekerja" class="btn">Bekerja Bersama</a>
                </div>
            </div>
            
            <div></div> <!-- Spacer -->
        </div>

        <!-- Kolom Kanan -->
        <div class="right-section">
            <div class="right-overlay">
                <div class="profile-badge">
                    <div class="profile-arabic-name">راني<br>أبو فازا</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
