<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronny Abu Faza - Pelajar Sepanjang Hayat</title>

    <!-- ✅ FIX #5: Meta SEO & Social Preview (Open Graph + Twitter Card) -->
    <meta name="description" content="Ronny Abu Faza - Pelajar Sepanjang Hayat. Belajar Bahasa Arab, Ilmu Islam, dan berkarya bersama.">
    <meta property="og:title" content="Ronny Abu Faza - Pelajar Sepanjang Hayat">
    <meta property="og:description" content="Belajar Bahasa Arab, Ilmu Islam, dan berkarya bersama.">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/ronnyabufaza/ronnyabufaza.github.io@main/free-photo-of-arabic-language-books-on-a-library-shelf.webp">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ronny Abu Faza - Pelajar Sepanjang Hayat">
    <meta name="twitter:image" content="https://cdn.jsdelivr.net/gh/ronnyabufaza/ronnyabufaza.github.io@main/free-photo-of-arabic-language-books-on-a-library-shelf.webp">

    <!-- FAVICON RAF LOGO -->
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/zHRGCQbS/RAF-Logo.png">
    <link rel="shortcut icon" type="image/png" href="https://i.ibb.co.com/zHRGCQbS/RAF-Logo.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/zHRGCQbS/RAF-Logo.png">

    <!-- ✅ FIX #4: @import diganti <link> + preconnect, supaya font tidak memblokir render.
         ✅ FIX #3: tambah font Amiri untuk teks Arab (Traditional Arabic hampir pasti tidak
         terinstall di HP/laptop pengunjung). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Cinzel', 'Times New Roman', serif;
            background-color: #0f1115;
            color: #ffffff;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }
        /* Bagian Kiri */
        .left-section {
            flex: 1.2;
            /* ✅ FIX #2: URL GitHub "blob...raw=true" (redirect 2x, rawan rate-limit)
               diganti ke jsDelivr CDN (cache global, lebih cepat & stabil) */
            background: linear-gradient(rgba(15, 17, 21, 0.7), rgba(15, 17, 21, 0.85)), url('https://cdn.jsdelivr.net/gh/ronnyabufaza/ronnyabufaza.github.io@main/free-photo-of-arabic-language-books-on-a-library-shelf.webp') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            position: relative;
            z-index: 1;
        }
        .top-brand {
            font-size: 14px;
            letter-spacing: 4px;
            color: #cccccc;
            text-transform: uppercase;
        }
        .main-title-box {
            margin: auto 0;
            position: relative;
            z-index: 2;
        }
        .main-title {
            font-size: clamp(3rem, 5vw, 5.5rem);
            font-weight: 300;
            line-height: 1.1;
            letter-spacing: 2px;
            color: #f0f0f0;
            margin-bottom: 25px;
        }
        .arabic-quote {
            font-size: 1.4rem;
            color: #d4af37;
            margin-bottom: 10px;
            /* ✅ FIX #3: font Arab yang benar-benar ter-load, dengan fallback yang wajar */
            font-family: 'Amiri', 'Traditional Arabic', 'Times New Roman', serif;
        }
        .translation-quote {
            font-size: 0.9rem;
            color: #aaaaaa;
            font-style: italic;
            max-width: 450px;
            line-height: 1.5;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            position: relative;
            z-index: 10;
        }
        .btn {
            padding: 12px 28px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            /* ✅ FIX #6: tambahkan prefix -webkit- supaya blur juga jalan di Safari/iOS */
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            display: inline-block;
            position: relative;
            z-index: 10;
            cursor: pointer;
            pointer-events: auto;
        }
        .btn:hover {
            background: #ffffff;
            color: #0f1115;
            border-color: #ffffff;
        }
        /* Bagian Kanan */
        .right-section {
            flex: 1;
            /* ✅ FIX #7: background-color fallback kalau gambar gagal dimuat */
            background-color: #0f1115;
            /* ✅ FIX #2: sama seperti kiri, pakai jsDelivr CDN */
            background-image: url('https://cdn.jsdelivr.net/gh/ronnyabufaza/ronnyabufaza.github.io@main/Untitled%20design_20260904_205521_0000.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            position: relative;
            z-index: 0;
        }
        /* Responsif untuk HP */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            .left-section, .right-section {
                min-height: 100vh;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kolom Kiri -->
        <div class="left-section">
            <div class="top-brand">Ronny Abu Faza</div>
            
            <div class="main-title-box">
                <h1 class="main-title">PELAJAR<br>SEPANJANG<br>HAYAT</h1>
                <div class="arabic-quote">وَقُلْ رَبِّ زِدْنِي عِلْمًا</div>
                <div class="translation-quote">"Dan katakanlah: Ya Rabb, tambahkanlah aku ilmu lain di samping ilmu yang telah Engkau ajarkan padaku!"</div>
                
                <div class="button-group">
                    <a href="https://sites.google.com/view/daruz/ziyadah" class="btn" target="_blank" rel="noopener noreferrer">Belajar Bersama</a>
                    <!-- Tombol ini belum diubah (menunggu keputusan tujuan link) -->
                    <a href="#bekerja" class="btn">Bekerja Bersama</a>
                </div>
            </div>
            
            <div></div>
        </div>

        <!-- Kolom Kanan -->
        <!-- ✅ FIX #7: role + aria-label supaya screen reader tahu ini gambar, bukan kosong -->
        <div class="right-section" role="img" aria-label="Foto Ronny Abu Faza"></div>
    </div>

</body>
</html>
